name: build (2.0)

on:
  push:
    branches: [v2]
    tags: ['v2.*']
  pull_request:
    branches: [v2]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build Galah2.sln -c Release

      - name: COM round-trip probes
        run: dotnet run --project tools/ComProbe -c Release --no-build

      # These probes open real windows (WriteableBitmap needs a render backend), so they only
      # pass on a runner that has an interactive desktop session.
      - name: Icon probes
        shell: pwsh
        run: |
          dotnet run --project tools/IconProbe -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw "icon probes failed" }

      - name: Settings window probes
        shell: pwsh
        run: |
          dotnet run --project tools/SettingsProbe -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw "settings probes failed" }

      - name: Panel command-surface probes
        shell: pwsh
        run: |
          dotnet run --project tools/PanelProbe -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw "panel probes failed" }

      # Drives the real executable across the process boundary: tray residency, toggle
      # forwarding, panel appearance, close-to-hide, and that the panel can be summoned again.
      - name: Process-level acceptance
        shell: pwsh
        run: |
          dotnet run --project tools/UiAcceptance -c Release --no-build -- "src/Galah2/bin/Release/net8.0/Galah2.exe"
          if ($LASTEXITCODE -ne 0) { throw "process acceptance failed" }

      # NativeAOT needs the MSVC linker; windows-latest ships VS with the C++ workload.
      # PublishAot and PublishSingleFile are mutually exclusive in .NET 8, so the deliverable is a
      # folder: the exe plus the three native libraries Skia/HarfBuzz/GLES need to sit beside it.
      - name: Publish (NativeAOT)
        run: >
          dotnet publish src/Galah2 -c Release -r win-x64 -p:PublishAot=true
          -o artifact

      # A publish that succeeded proves the code compiled, not that it runs: reflection-based
      # JSON throws JsonSerializerIsReflectionDisabled at startup under AOT. This step is the
      # only thing that catches that class of failure - and it copies the WHOLE folder, because
      # the exe alone cannot start.
      - name: Smoke test the AOT folder
        shell: pwsh
        run: |
          if (-not (Test-Path "artifact\Galah2.exe")) { throw "AOT output missing" }

          $dir = Join-Path $env:RUNNER_TEMP "smoke"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item artifact/* -Destination $dir -Recurse -Exclude *.pdb

          $p = Start-Process -FilePath (Join-Path $dir "Galah2.exe") -WorkingDirectory $dir -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            throw "AOT binary exited during startup (code $($p.ExitCode)) - likely JsonSerializer reflection"
          }
          Write-Host "AOT binary still running after 10s: OK"
          Write-Host "green folder files: $((Get-ChildItem $dir -File).Count)"
          $p.Kill()

      # Strip the debug symbols: 175 MB of .pdb in a "green" download is pure waste.
      - name: Slim the artifact
        shell: pwsh
        run: |
          Remove-Item artifact/*.pdb -ErrorAction SilentlyContinue
          $files = Get-ChildItem artifact -File
          $size = ($files | Measure-Object Length -Sum).Sum
          Write-Host ("artifact: {0:N1} MB across {1} file(s)" -f ($size/1MB), $files.Count)

      # Proves the published folder is actually portable: runs from anywhere, keeps every byte of
      # user data beside the exe, and adds nothing to the system unless asked.
      - name: Portable check
        shell: pwsh
        run: |
          dotnet run --project tools/PortableCheck -c Release --no-build -- "artifact"
          if ($LASTEXITCODE -ne 0) { throw "published build is not portable" }

      - name: Upload artifact (whole folder)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Galah2-windows-x64-aot
          path: artifact/
          retention-days: 14

      # A release asset has to be one file, and the app needs four, so it ships as a zip.
      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path artifact/* -DestinationPath Galah2-windows-x64.zip -Force

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Galah2-windows-x64.zip
          generate_release_notes: true
