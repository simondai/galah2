name: build (2.0)

on:
  push:
    branches: [v2]
    tags: ['v2.*']
  pull_request:
    branches: [v2]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build Galah2.sln -c Release

      - name: COM round-trip probes
        run: dotnet run --project tools/ComProbe -c Release --no-build

      # These probes open real windows (WriteableBitmap needs a render backend), so they only
      # pass on a runner that has an interactive desktop session.
      - name: Icon probes
        shell: pwsh
        run: |
          dotnet run --project tools/IconProbe -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw "icon probes failed" }

      - name: Settings window probes
        shell: pwsh
        run: |
          dotnet run --project tools/SettingsProbe -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw "settings probes failed" }

      - name: Panel command-surface probes
        shell: pwsh
        run: |
          dotnet run --project tools/PanelProbe -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw "panel probes failed" }

      # Drives the real executable across the process boundary: tray residency, toggle
      # forwarding, panel appearance, close-to-hide, and that the panel can be summoned again.
      - name: Process-level acceptance
        shell: pwsh
        run: |
          dotnet run --project tools/UiAcceptance -c Release --no-build -- 
            "src/Galah2/bin/Release/net8.0/Galah2.exe"
          if ($LASTEXITCODE -ne 0) { throw "process acceptance failed" }

      # NativeAOT needs the MSVC linker; windows-latest ships VS with the C++ workload.
      - name: Publish (NativeAOT)
        run: >
          dotnet publish src/Galah2 -c Release -r win-x64 -p:PublishAot=true
          -o artifact

      # A publish that succeeded proves the code compiled, not that it runs: reflection-based
      # JSON throws JsonSerializerIsReflectionDisabled at startup under AOT. This step is the
      # only thing that catches that class of failure.
      - name: Smoke test the AOT binary
        shell: pwsh
        run: |
          $exe = "artifact\Galah2.exe"
          if (-not (Test-Path $exe)) { throw "AOT output missing" }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "AOT exe size: $size MB"

          $dir = Join-Path $env:RUNNER_TEMP "smoke"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item $exe $dir

          $p = Start-Process -FilePath (Join-Path $dir "Galah2.exe") -WorkingDirectory $dir -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            throw "AOT binary exited during startup (code $($p.ExitCode)) - likely JsonSerializer reflection"
          }
          Write-Host "AOT binary still running after 10s: OK"
          $p.Kill()

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Galah2-windows-x64-aot
          path: artifact/Galah2.exe
          retention-days: 14

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifact/Galah2.exe
          generate_release_notes: true
